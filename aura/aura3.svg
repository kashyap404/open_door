<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 190" width="100%" role="img" aria-labelledby="aura-title aura-desc" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="aura-title">Project Aura: how it works</title>
  <desc id="aura-desc">A three-step flow. Step 1, the transmitter, is an FM tower (the sunlight) broadcasting an FM signal. The signal hits step 2, the Aura PCB, a backscatter switch that acts as a mirror and toggles its reflection. Step 3, the receiver, a HackRF or RTL-SDR, picks up the reflections.</desc>
  <defs>
    <marker id="aura-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="740" height="190" fill="#ffffff"/>
  <g fill="#ffffff" stroke="#000000" stroke-width="2">
    <rect x="15" y="20" width="210" height="150" rx="6"/>
    <rect x="265" y="20" width="210" height="150" rx="6"/>
    <rect x="515" y="20" width="210" height="150" rx="6"/>
  </g>
  <g fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M120 44L106 86M120 44L134 86M106 86H134M115.3 58H124.7M110.7 72H129.3M115.3 58L129.3 72M124.7 58L110.7 72M110.7 72L134 86M129.3 72L106 86"/>
      <circle cx="120" cy="42" r="2.5"/>
      <path d="M129 34A12 12 0 0 1 129 50M134 30A20 20 0 0 1 134 54M111 34A12 12 0 0 0 111 50M106 30A20 20 0 0 0 106 54"/>
    </g>
  <g fill="#000000" text-anchor="middle">
    <text x="120" y="108" font-size="20" font-weight="bold">1. Transmitter</text>
    <text x="120" y="132" font-size="16">FM tower (sunlight)</text>
    <text x="120" y="154" font-size="14">Broadcasts FM signal</text>
    <text x="370" y="108" font-size="20" font-weight="bold">2. Aura PCB</text>
    <text x="370" y="132" font-size="16">Backscatter switch (mirror)</text>
    <text x="370" y="154" font-size="14">Toggles the reflection</text>
    <text x="620" y="108" font-size="20" font-weight="bold">3. Receiver</text>
    <text x="620" y="132" font-size="16">HackRF / RTL-SDR</text>
    <text x="620" y="154" font-size="14">Sees the reflections</text>
  </g>
  <g stroke="#000000" stroke-width="2.5" fill="none">
    <line x1="227" y1="95" x2="261" y2="95" marker-end="url(#aura-arrow)"/>
    <line x1="477" y1="95" x2="511" y2="95" marker-end="url(#aura-arrow)"/>
  </g>
</svg>
